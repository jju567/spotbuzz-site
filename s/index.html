<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpotPack – SpotBuzz Shared Place List</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <style>
    :root {
      --bg: #070d19;
      --card: #131f35;
      --border: #23334d;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --accent-green: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #0f1e36 0%, var(--bg) 60%);
      color: var(--text);
      line-height: 1.55;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--text);
      text-decoration: none;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 12px var(--accent-green);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 6px; font-size: 1.55rem; }
    .meta { color: var(--accent); font-size: 0.95rem; margin-bottom: 16px; }
    .place-list { list-style: none; padding: 0; margin: 0; }
    .place-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }
    .place-item:first-child { border-top: none; }
    .place-name { font-weight: 600; }
    .place-sub { color: var(--muted); font-size: 0.88rem; }
    .osm-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.88rem;
      white-space: nowrap;
    }
    .osm-link:hover { text-decoration: underline; }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .btn {
      display: inline-block;
      padding: 11px 18px;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
    }
    .btn-primary { background: var(--accent); color: #06131f; }
    .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .note { color: var(--muted); font-size: 0.86rem; margin-top: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="header">
      <a class="brand" href="../">
        <span class="dot"></span>
        <span>SpotBuzz SpotPack</span>
      </a>
      <a class="osm-link" href="../privacy.html">Privacy</a>
    </div>

    <section class="card">
      <h1 id="pack-title">Loading SpotPack…</h1>
      <div id="pack-meta" class="meta"></div>
      <ul id="place-list" class="place-list"></ul>
      <div class="actions">
        <button id="btn-copy" class="btn btn-primary" type="button" onclick="copyLink()">Copy SpotPack Link</button>
        <a class="btn btn-secondary" href="../">About SpotBuzz</a>
      </div>
      <p class="note">
        Privacy-first: All places in this SpotPack are decoded locally in your browser from the URL fragment — nothing is sent to a server.
        Paste or share this link into <strong>SpotBuzz</strong> on Android to import it.
      </p>
    </section>
  </main>

  <script>
    function b64UrlToBytes(b64url) {
      var b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    async function decodeSpotPack() {
      var titleEl = document.getElementById('pack-title');
      var metaEl = document.getElementById('pack-meta');
      var listEl = document.getElementById('place-list');
      var hash = window.location.hash || '';
      var match = hash.match(/v1=([A-Za-z0-9_-]+)/);
      if (!match) {
        titleEl.textContent = 'No SpotPack data in link';
        metaEl.textContent = 'Share a SpotPack from SpotBuzz on Android to preview it here.';
        return;
      }
      try {
        var compressed = b64UrlToBytes(match[1]);
        var ds = new DecompressionStream('gzip');
        var writer = ds.writable.getWriter();
        writer.write(compressed);
        writer.close();
        var text = await new Response(ds.readable).text();
        var data = JSON.parse(text);
        if (data.v !== 1 || !Array.isArray(data.p)) throw new Error('Invalid format');

        titleEl.textContent = String(data.t || 'SpotBuzz SpotPack');
        metaEl.textContent = data.p.length + ' places • Decoded locally in browser';

        data.p.slice(0, 100).forEach(function (item) {
          var la = Number(item.la);
          var lo = Number(item.lo);
          if (!Number.isFinite(la) || !Number.isFinite(lo)) return;
          var li = document.createElement('li');
          li.className = 'place-item';

          var left = document.createElement('div');
          var nameDiv = document.createElement('div');
          nameDiv.className = 'place-name';
          nameDiv.textContent = String(item.n || 'Place');
          left.appendChild(nameDiv);

          var subDiv = document.createElement('div');
          subDiv.className = 'place-sub';
          var radiusTxt = (item.r ? Number(item.r) : 100) + ' m';
          subDiv.textContent = item.d ? (String(item.d) + ' • ' + radiusTxt) : radiusTxt;
          left.appendChild(subDiv);

          var link = document.createElement('a');
          link.className = 'osm-link';
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.href = 'https://www.openstreetmap.org/?mlat=' + la.toFixed(6) + '&mlon=' + lo.toFixed(6) + '#map=16/' + la.toFixed(6) + '/' + lo.toFixed(6);
          link.textContent = 'Map ↗';

          li.appendChild(left);
          li.appendChild(link);
          listEl.appendChild(li);
        });
      } catch (err) {
        titleEl.textContent = 'Invalid SpotPack link';
        metaEl.textContent = 'Could not decode this SpotPack link.';
      }
    }

    function copyLink() {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(window.location.href).then(function () {
          document.getElementById('btn-copy').textContent = 'Copied!';
        });
      }
    }

    decodeSpotPack();
  </script>
</body>
</html>
