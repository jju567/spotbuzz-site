<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpotPack – SpotBuzz</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <style>
    :root {
      --bg: #070d19;
      --card: #131f35;
      --border: #23334d;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --accent-green: #34d399;
      --accent-glow: rgba(34, 211, 238, 0.16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #0f1e36 0%, var(--bg) 60%);
      color: var(--text);
      line-height: 1.55;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--text);
      text-decoration: none;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 12px var(--accent-green);
    }
    nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .lang-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .lang-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-glow);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 6px; font-size: 1.55rem; }
    .meta { color: var(--accent); font-size: 0.95rem; margin-bottom: 16px; }
    .place-list { list-style: none; padding: 0; margin: 0; }
    .place-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }
    .place-item:first-child { border-top: none; }
    .place-name { font-weight: 600; }
    .place-sub { color: var(--muted); font-size: 0.88rem; }
    .osm-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.88rem;
      white-space: nowrap;
    }
    .osm-link:hover { text-decoration: underline; }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .btn {
      display: inline-block;
      padding: 11px 18px;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
    }
    .btn-primary { background: var(--accent); color: #06131f; }
    .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .note { color: var(--muted); font-size: 0.86rem; margin-top: 14px; }
    .spotpack-explainer {
      background: rgba(34, 211, 238, 0.08);
      border: 1px solid rgba(34, 211, 238, 0.28);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 0.92rem;
      color: var(--text);
    }
    .spotpack-explainer strong { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="header">
      <a class="brand" href="../">
        <span class="dot"></span>
        <span>SpotBuzz SpotPack</span>
      </a>
      <nav>
        <a id="nav-privacy" class="osm-link" href="../privacy.html">Privacy</a>
        <button id="btn-en" class="lang-btn active" type="button" onclick="setLang('en')">EN</button>
        <button id="btn-fi" class="lang-btn" type="button" onclick="setLang('fi')">FI</button>
      </nav>
    </div>

    <div id="spotpack-explainer" class="spotpack-explainer">
      <strong>What is a SpotPack?</strong> A portable collection of places &amp; reminders encoded directly in this link (no server or account needed). Open it in SpotBuzz to import all spots into their own folder at once.
    </div>

    <section class="card">
      <h1 id="pack-title">Loading SpotPack…</h1>
      <div id="pack-meta" class="meta"></div>
      <ul id="place-list" class="place-list"></ul>
      <div class="actions">
        <a id="btn-open-app" class="btn btn-primary" href="#" style="display:none">Open in SpotBuzz</a>
        <button id="btn-copy" class="btn btn-secondary" type="button" onclick="copyLink()">Copy SpotPack Link</button>
        <button id="btn-dl" class="btn btn-secondary" type="button" onclick="downloadJson()" style="display:none">Download .json</button>
        <button id="btn-demo" class="btn btn-primary" type="button" onclick="loadDemo()" style="display:none">Load Demo: Oulu Top 10</button>
        <a id="btn-about" class="btn btn-secondary" href="../">About SpotBuzz</a>
      </div>
      <p id="pack-note" class="note"></p>
    </section>
  </main>

  <script>
    var DEMO_HASH = '#v1=H4sIADILCWsC_23Su26DMBQG4FexPHRCEQYMLlubJZV6iZpsVQcLrHIKsakvkaoo714HIjBtR4P86fz_8QkfcUkibHGJX1zn0F71iMQ4wj0u305Y-u97paFXXQdgwP_oOC5zuopJSm79SeEyoassp4k_aVyyOMK1v_XEdSss2n05rgUyllsn8DkayWfuuZbr0EtjwmYvviX54BF6Be8Frxp0gzr4aGyjnJm5PQirDpyH07G0mDVGkxGLr9iuAiErgdZCWj1DdyBVx2XvwFi1yDpbBRup5EqtwX6j3qedlFdlHV-GI4QlATFEDefZiloYq4FLX5UWwk7YZSsSWacOoFrQbbuYKytClrJ0yQ4rXXPbiFrzbjK30IL5PSHLspmiGVm2v7k0oqFCXFt_VyIwvqh6IjeuH0g_-WIJYXEFXZoPA2GW5T2ClFz-ma5IgqD5cPonqLGdQNqBNPPbcKDDh5HkwURjyCRUPn3LSMNRaAO1fxnv5x93Xee8JAMAAA';
    var I18N = {
      en: {
        privacy: 'Privacy',
        privacyHref: '../privacy.html',
        loading: 'Loading SpotPack…',
        emptyTitle: 'SpotBuzz SpotPack',
        emptyMeta: 'No SpotPack in URL yet — try the Oulu Top 10 demo pack below!',
        placesMeta: '{n} places • Decoded locally in browser',
        mapLink: 'Map ↗',
        invalidTitle: 'Invalid SpotPack link',
        invalidMeta: 'Could not decode this SpotPack link.',
        copyBtn: 'Copy SpotPack Link',
        copiedBtn: 'Copied!',
        openAppBtn: 'Open in SpotBuzz',
        dlBtn: 'Download .json',
        demoBtn: 'Load Demo: Oulu Top 10',
        aboutBtn: 'About SpotBuzz',
        explainerHtml: '<strong>What is a SpotPack?</strong> A portable collection of places &amp; reminders encoded directly in this link (no server or account needed). Open it in SpotBuzz to import all spots into their own folder at once.',
        note: 'Privacy-first: Decoded locally in your browser from the URL fragment. Tap "Open in SpotBuzz" (or "Download .json" -> Import File in SpotBuzz, or "Copy SpotPack Link" -> Maps Link in SpotBuzz).'
      },
      fi: {
        privacy: 'Tietosuoja',
        privacyHref: '../privacy.html#fi',
        loading: 'Puretaan SpotPack-listaa…',
        emptyTitle: 'SpotBuzz SpotPack',
        emptyMeta: 'Linkissä ei ole vielä pakettia — kokeile alla olevaa Oulu Top 10 -demopakettia!',
        placesMeta: '{n} kohdetta • Purettu paikallisesti selaimessa',
        mapLink: 'Kartta ↗',
        invalidTitle: 'Virheellinen SpotPack-linkki',
        invalidMeta: 'Tätä SpotPack-linkkiä ei voitu purkaa.',
        copyBtn: 'Kopioi SpotPack-linkki',
        copiedBtn: 'Kopioitu!',
        openAppBtn: 'Avaa SpotBuzzissa',
        dlBtn: 'Lataa .json',
        demoBtn: 'Lataa demo: Oulu Top 10',
        aboutBtn: 'Tietoa SpotBuzzista',
        explainerHtml: '<strong>Mikä on SpotPack?</strong> Linkin sisään pakattu kohde- ja muistutuskokoelma (ei vaadi palvelinta tai tiliä). Avaa se SpotBuzzissa tuodaksesi kaikki kohteet kerralla omaan kansioonsa.',
        note: 'Yksityisyys ensin: Puretaan paikallisesti selaimessa URL-fragmentista. Paina "Avaa SpotBuzzissa" (tai "Lataa .json" → SpotBuzzissa Tuo tiedosto, tai "Kopioi SpotPack-linkki" → Maps-linkki).'
      }
    };

    var currentLang = 'en';
    var currentPack = null;

    function setLang(lang) {
      currentLang = lang === 'fi' ? 'fi' : 'en';
      document.documentElement.lang = currentLang;
      document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');
      document.getElementById('btn-fi').classList.toggle('active', currentLang === 'fi');
      try { localStorage.setItem('spotbuzz_lang', currentLang); } catch (_) {}

      var t = I18N[currentLang];
      var priv = document.getElementById('nav-privacy');
      priv.textContent = t.privacy;
      priv.href = t.privacyHref;
      document.getElementById('btn-open-app').textContent = t.openAppBtn;
      document.getElementById('btn-copy').textContent = t.copyBtn;
      document.getElementById('btn-dl').textContent = t.dlBtn;
      document.getElementById('btn-demo').textContent = t.demoBtn;
      document.getElementById('btn-about').textContent = t.aboutBtn;
      document.getElementById('spotpack-explainer').innerHTML = t.explainerHtml;
      document.getElementById('pack-note').textContent = t.note;
      decodeSpotPack();
    }

    function b64UrlToBytes(b64url) {
      var b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    async function decodeSpotPack() {
      var t = I18N[currentLang];
      var titleEl = document.getElementById('pack-title');
      var metaEl = document.getElementById('pack-meta');
      var listEl = document.getElementById('place-list');
      var openBtn = document.getElementById('btn-open-app');
      var copyBtn = document.getElementById('btn-copy');
      var dlBtn = document.getElementById('btn-dl');
      var demoBtn = document.getElementById('btn-demo');
      listEl.innerHTML = '';
      currentPack = null;

      var hash = window.location.hash || '';
      var match = hash.match(/v1=([A-Za-z0-9_-]+)/);
      if (!match) {
        titleEl.textContent = t.emptyTitle;
        metaEl.textContent = t.emptyMeta;
        openBtn.style.display = 'none';
        copyBtn.style.display = 'none';
        dlBtn.style.display = 'none';
        demoBtn.style.display = 'inline-block';
        return;
      }
      openBtn.href = 'spotbuzz://s#v1=' + match[1];
      openBtn.style.display = 'inline-block';
      copyBtn.style.display = 'inline-block';
      demoBtn.style.display = 'none';
      try {
        var compressed = b64UrlToBytes(match[1]);
        var ds = new DecompressionStream('gzip');
        var writer = ds.writable.getWriter();
        writer.write(compressed);
        writer.close();
        var text = await new Response(ds.readable).text();
        var data = JSON.parse(text);
        if (data.v !== 1 || !Array.isArray(data.p)) throw new Error('Invalid format');

        currentPack = data;
        dlBtn.style.display = 'inline-block';
        titleEl.textContent = String(data.t || 'SpotBuzz SpotPack');
        metaEl.textContent = t.placesMeta.replace('{n}', String(data.p.length));

        data.p.slice(0, 100).forEach(function (item) {
          var la = Number(item.la);
          var lo = Number(item.lo);
          if (!Number.isFinite(la) || !Number.isFinite(lo)) return;
          var li = document.createElement('li');
          li.className = 'place-item';

          var left = document.createElement('div');
          var nameDiv = document.createElement('div');
          nameDiv.className = 'place-name';
          nameDiv.textContent = String(item.n || 'Place');
          left.appendChild(nameDiv);

          var subDiv = document.createElement('div');
          subDiv.className = 'place-sub';
          var radiusTxt = (item.r ? Number(item.r) : 100) + ' m';
          subDiv.textContent = item.d ? (String(item.d) + ' • ' + radiusTxt) : radiusTxt;
          left.appendChild(subDiv);

          var link = document.createElement('a');
          link.className = 'osm-link';
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.href = 'https://www.openstreetmap.org/?mlat=' + la.toFixed(6) + '&mlon=' + lo.toFixed(6) + '#map=16/' + la.toFixed(6) + '/' + lo.toFixed(6);
          link.textContent = t.mapLink;

          li.appendChild(left);
          li.appendChild(link);
          listEl.appendChild(li);
        });
      } catch (err) {
        titleEl.textContent = t.invalidTitle;
        metaEl.textContent = t.invalidMeta;
        dlBtn.style.display = 'none';
      }
    }

    function loadDemo() {
      window.location.hash = DEMO_HASH;
    }

    function downloadJson() {
      if (!currentPack) return;
      var places = currentPack.p.map(function (item) {
        return {
          name: String(item.n || 'Place'),
          latitude: Number(item.la),
          longitude: Number(item.lo),
          radiusMeters: item.r ? Number(item.r) : 100,
          description: item.d ? String(item.d) : '',
          category: String(currentPack.t || 'SpotBuzz')
        };
      });
      var blob = new Blob([JSON.stringify(places, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = String(currentPack.t || 'spotpack').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.json';
      a.click();
    }

    function copyLink() {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(window.location.href).then(function () {
          document.getElementById('btn-copy').textContent = I18N[currentLang].copiedBtn;
        });
      }
    }

    window.addEventListener('hashchange', decodeSpotPack);
    var savedLang = null;
    try { savedLang = localStorage.getItem('spotbuzz_lang'); } catch (_) {}
    if (savedLang === 'fi' || (!savedLang && navigator.language && navigator.language.toLowerCase().startsWith('fi'))) {
      setLang('fi');
    } else {
      setLang('en');
    }
  </script>
</body>
</html>
